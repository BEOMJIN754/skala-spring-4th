spring:
  application:
    name: shop1
  
  datasource:
    url: jdbc:h2:mem:stockdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  data:
    redis:
      host: localhost
      port: 6379

  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    com.onlineshop.shop1: DEBUG
    org.springframework.web: INFO

jwt:
  secret: oM7p4RrG8nq0L7w+q3y1A2Z9JpKf8cVxE6bHdT5sNQk=
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
